spring:
  application:
    name: capstone
  datasource:
    url: jdbc:h2:mem:capstone
    driverClassName: org.h2.Driver
    username: sa
    password: 
  h2:
    console:
      enabled: true
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: true
    show-sql: false
  flyway:
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: 8080

jwt:
  secret: your-super-secret-key-that-is-long-enough-for-hs512-algorithm-minimum-64-chars-required-here-so-adding-more
  expiration: 86400000

logging:
  level:
    root: INFO
    com.meridian.capstone: DEBUG

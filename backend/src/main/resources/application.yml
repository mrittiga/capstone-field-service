spring:
  application:
    name: capstone
  
  datasource:
    url: jdbc:postgresql://localhost:5432/capstone_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  
  flyway:
    locations: classpath:db/migration
    baseline-on-migrate: true

jwt:
  secret: your-super-secret-key-with-at-least-32-characters-for-hs512-algorithm
  expiration: 86400000

server:
  port: 8080
  servlet:
    context-path: /

logging:
  level:
    root: INFO
    com.meridian.capstone: DEBUG

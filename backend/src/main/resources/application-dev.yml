spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/capstone
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080

logging:
  level:
    com.meridian.capstone: DEBUG
    org.springframework.security: DEBUG
